
<title>Howard Reading 期中考複習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── tokens ── */
:root {
  --bg:#f4f6fb; --surface:#fff; --raised:#e8ecf5; --border:#d0d8e8;
  --fg:#1a2035; --muted:#6b7a99; --egypt:#d4700a; --yeller:#2e7d32;
  --oral:#7b1fa2; --mock:#1565c0; --correct:#2e7d32; --wrong:#c62828;
  --teal:#00838f; --accent:#5c6bc0;
  color-scheme: light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117; --surface:#1a1d2e; --raised:#252840; --border:#343860;
  --fg:#e8eaf6; --muted:#9fa8da; --egypt:#ffb74d; --yeller:#81c784;
  --oral:#ce93d8; --mock:#90caf9; --correct:#81c784; --wrong:#ef9a9a;
  --teal:#4dd0e1; --accent:#9fa8da;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1117; --surface:#1a1d2e; --raised:#252840; --border:#343860;
  --fg:#e8eaf6; --muted:#9fa8da; --egypt:#ffb74d; --yeller:#81c784;
  --oral:#ce93d8; --mock:#90caf9; --correct:#81c784; --wrong:#ef9a9a;
  --teal:#4dd0e1; --accent:#9fa8da;
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Nunito',sans-serif;font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;min-height:100vh;
}

/* ── top bar ── */
#topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--surface);border-bottom:2px solid var(--border);
  padding:10px 16px 0;
}
#topbar h1{font-family:'Fredoka One',cursive;font-size:1.25rem;color:var(--accent);margin-bottom:8px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex-shrink:0;padding:6px 14px;border-radius:20px 20px 0 0;
  border:2px solid var(--border);border-bottom:none;
  background:var(--raised);color:var(--muted);font-family:'Nunito',sans-serif;
  font-weight:700;font-size:.82rem;cursor:pointer;transition:.2s;white-space:nowrap;
}
.tab-btn.active{background:var(--surface);color:var(--fg);border-color:var(--border)}
.tab-btn[data-color="egypt"].active{color:var(--egypt)}
.tab-btn[data-color="yeller"].active{color:var(--yeller)}
.tab-btn[data-color="oral"].active{color:var(--oral)}
.tab-btn[data-color="mock"].active{color:var(--mock)}

/* ── panels ── */
.panel{display:none;padding:20px 0 40px;max-width:700px;margin:0 auto}
.panel.active{display:block}

/* ── section header ── */
.sec-hd{
  font-family:'Fredoka One',cursive;font-size:1.4rem;
  margin-bottom:16px;display:flex;align-items:center;gap:8px
}

/* ── quiz card ── */
.qcard{
  background:var(--surface);border:2px solid var(--border);
  border-radius:16px;padding:20px;margin-bottom:16px;
}
.qcard .qnum{font-size:.75rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.qcard .qtext{font-size:1.05rem;font-weight:700;margin-bottom:14px;line-height:1.5}
.qcard .choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{
  padding:10px 14px;border-radius:10px;border:2px solid var(--border);
  background:var(--raised);color:var(--fg);font-family:'Nunito',sans-serif;
  font-size:.95rem;font-weight:600;text-align:left;cursor:pointer;
  transition:.15s;line-height:1.4;
}
.choice-btn:hover:not(:disabled){background:var(--accent);color:#fff;border-color:var(--accent)}
.choice-btn.correct{background:var(--correct)!important;color:#fff!important;border-color:var(--correct)!important}
.choice-btn.wrong{background:var(--wrong)!important;color:#fff!important;border-color:var(--wrong)!important}
.choice-btn:disabled{cursor:default;opacity:.8}
.fill-input{
  width:100%;padding:10px 14px;border-radius:10px;border:2px solid var(--border);
  background:var(--raised);color:var(--fg);font-family:'Nunito',sans-serif;
  font-size:.95rem;font-weight:600;outline:none;
}
.fill-input:focus{border-color:var(--accent)}
.fill-input.correct{border-color:var(--correct);background:rgba(46,125,50,.12)}
.fill-input.wrong{border-color:var(--wrong);background:rgba(198,40,40,.12)}
.check-btn{
  margin-top:10px;padding:8px 20px;border-radius:20px;border:none;
  background:var(--accent);color:#fff;font-family:'Nunito',sans-serif;
  font-size:.9rem;font-weight:700;cursor:pointer;
}
.check-btn:disabled{opacity:.5;cursor:default}
.feedback{margin-top:10px;padding:8px 12px;border-radius:8px;font-weight:700;font-size:.9rem}
.feedback.ok{background:rgba(46,125,50,.15);color:var(--correct)}
.feedback.bad{background:rgba(198,40,40,.12);color:var(--wrong)}
.ans-reveal{
  margin-top:8px;padding:10px 14px;border-radius:8px;
  background:#fff9c4;color:#4a3b00;font-weight:700;font-size:.95rem;
  border:2px solid #f9a825;
}

/* ── progress bar ── */
.prog-wrap{margin-bottom:12px}
.prog-label{font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.prog-bar{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:var(--accent);transition:.4s}

/* ── score ring ── */
.score-ring-wrap{display:flex;justify-content:center;margin:16px 0}
svg.ring{width:120px;height:120px}
.ring-bg{fill:none;stroke:var(--raised);stroke-width:10}
.ring-fg{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring-text{font-family:'Fredoka One',cursive;font-size:1.5rem;fill:var(--fg)}

/* ── mock timer ── */
#timer-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:2px solid var(--border);
  border-radius:12px;padding:10px 16px;margin-bottom:16px;
}
#timer-display{font-family:'Fredoka One',cursive;font-size:1.5rem;color:var(--mock)}
#timer-bar .t-label{font-size:.85rem;color:var(--muted);font-weight:700}
#submit-mock{
  margin-left:auto;padding:8px 18px;border-radius:20px;border:none;
  background:var(--mock);color:#fff;font-weight:700;cursor:pointer;
  font-family:'Nunito',sans-serif;
}

/* ── oral cards ── */
.oral-card{
  background:var(--surface);border:2px solid var(--border);
  border-radius:16px;padding:20px;margin-bottom:14px;
}
.oral-q{font-size:1.05rem;font-weight:700;margin-bottom:12px;line-height:1.5}
.oral-model{
  background:var(--raised);border-radius:10px;padding:12px;
  font-size:.9rem;color:var(--muted);margin-bottom:12px;display:none;
}
.oral-model.show{display:block}
.oral-btns{display:flex;flex-wrap:wrap;gap:8px}
.oral-btn{
  padding:7px 14px;border-radius:20px;border:2px solid var(--border);
  background:var(--raised);color:var(--fg);font-family:'Nunito',sans-serif;
  font-size:.85rem;font-weight:700;cursor:pointer;
}
.oral-btn.speak{border-color:var(--teal);color:var(--teal)}
.oral-btn.rec{border-color:var(--wrong);color:var(--wrong)}
.oral-btn.rec.recording{background:var(--wrong);color:#fff}
.oral-btn.play{border-color:var(--yeller);color:var(--yeller)}
.oral-btn.reveal{border-color:var(--oral);color:var(--oral)}

/* ── result screen ── */
#result-screen{display:none;padding:20px 0 40px;max-width:700px;margin:0 auto}
.result-hd{font-family:'Fredoka One',cursive;font-size:1.6rem;text-align:center;margin-bottom:4px}
.result-sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:16px}
.review-item{
  background:var(--surface);border:2px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:10px;
}
.review-item.ok{border-color:var(--correct)}
.review-item.bad{border-color:var(--wrong)}
.review-q{font-weight:700;font-size:.95rem;margin-bottom:6px}
.review-ans{font-size:.85rem}
.review-ans span{font-weight:700}
.tag-ok{color:var(--correct)}
.tag-bad{color:var(--wrong)}
.restart-btn{
  display:block;margin:20px auto 0;padding:12px 32px;border-radius:25px;
  border:none;background:var(--accent);color:#fff;font-family:'Nunito',sans-serif;
  font-size:1rem;font-weight:700;cursor:pointer;
}

/* nav between qs */
.nav-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.nav-btn{
  padding:8px 20px;border-radius:20px;border:2px solid var(--border);
  background:var(--raised);color:var(--fg);font-family:'Nunito',sans-serif;
  font-size:.9rem;font-weight:700;cursor:pointer;
}
.nav-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-btn:disabled{opacity:.4;cursor:default}
</style>

// Old Yeller Comprehension Questions

/* ═══════════ HELPERS ═══════════ */
function shuf(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function norm(s){return s.trim().toLowerCase().replace(/[^a-z0-9]/g,"");}
function matchFill(input,answer){
  const ni=norm(input),na=norm(answer);
  if(ni===na)return true;
  // allow small typo (levenshtein ≤ 1 for words ≥ 4 chars)
  if(na.length>=4){
    let d=0;
    if(Math.abs(ni.length-na.length)>1)return false;
    const long=ni.length>na.length?ni:na,short=ni.length>na.length?na:ni;
    for(let i=0,j=0;i<long.length;i++){if(long[i]!==short[j]){d++;j--;}j++;if(d>1)return false;}
    return true;
  }
  return false;
}

/* ═══════════ QUIZ ENGINE ═══════════ */
function makeVocabQuestions(pool){
  // Mix: def→word (fill) and word→def (MC)
  const qs=[];
  const words=[...pool];
  // Fill: given definition, type the word
  words.forEach(item=>{
    qs.push({type:"fill",q:`Definition: "${item.def}"\n\nWhat is this vocabulary word?`,a:item.w,hint:`(${item.pos})`});
  });
  // MC: given word, choose definition
  words.forEach(item=>{
    const wrong=shuf(words.filter(x=>x.w!==item.w)).slice(0,3).map(x=>x.def);
    const opts=shuf([item.def,...wrong]);
    qs.push({type:"mc",q:`What is the definition of "${item.w}" (${item.pos})?`,opts,a:item.def});
  });
  return shuf(qs);
}

function makeCompQuestions(pool){
  return shuf(pool).map(q=>{
    const opts=shuf(q.o);
    return {type:"mc",q:q.q,opts,a:q.o[q.a]};
  });
}

function renderQuiz(panelId,questions,color){
  const panel=document.getElementById(panelId);
  let idx=0,score=0;
  const results=[];

  function render(){
    const q=questions[idx];
    const pct=Math.round((idx/questions.length)*100);
    panel.innerHTML=`
      <div class="prog-wrap">
        <div class="prog-label">Question ${idx+1} / ${questions.length}</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="qcard">
        <div class="qnum">Q${idx+1}</div>
        <div class="qtext">${q.q.replace(/\n/g,"<br>")}</div>
        ${q.type==="mc"?renderMC(q):renderFill(q)}
        <div id="fb" class="feedback" hidden></div>
        ${q.type==="fill"?`<div id="reveal" class="ans-reveal" hidden></div>`:""}
        <div class="nav-row">
          <button class="nav-btn" id="prev-btn" ${idx===0?"disabled":""} onclick="goPrev()">← Prev</button>
          <button class="nav-btn primary" id="next-btn" hidden onclick="goNext()">Next →</button>
          ${idx===questions.length-1?`<button class="nav-btn primary" id="finish-btn" hidden onclick="showResult()">Finish ✓</button>`:""}
        </div>
      </div>
    `;
    if(q.type==="fill"){
      document.querySelector(".fill-input").addEventListener("keydown",e=>{if(e.key==="Enter")document.querySelector(".check-btn").click();});
    }
  }

  function renderMC(q){
    return `<div class="choices">${q.opts.map((o,i)=>`<button class="choice-btn" onclick="checkMC(this,'${CSS.escape(o)}','${CSS.escape(q.a)}')">${o}</button>`).join("")}</div>`;
  }
  function renderFill(q){
    return `<input class="fill-input" placeholder="Type your answer…" id="fill-in">
    <button class="check-btn" onclick="checkFill('${CSS.escape(q.a)}')">Check Answer</button>`;
  }

  window.checkMC=function(btn,chosen,correct){
    const chosen2=CSS.unescape(chosen),correct2=CSS.unescape(correct);
    document.querySelectorAll(".choice-btn").forEach(b=>b.disabled=true);
    const ok=chosen2===correct2;
    btn.classList.add(ok?"correct":"wrong");
    if(!ok) document.querySelectorAll(".choice-btn").forEach(b=>{if(CSS.unescape(b.getAttribute("onclick").match(/'([^']+)','[^']+'\)/)[1])===correct2)b.classList.add("correct");});
    if(ok){score++;results.push({q:questions[idx].q,user:chosen2,correct:correct2,ok:true});}
    else{results.push({q:questions[idx].q,user:chosen2,correct:correct2,ok:false});}
    showNav(ok);
  };
  window.checkFill=function(correct){
    const correct2=CSS.unescape(correct);
    const inp=document.getElementById("fill-in");
    const val=inp.value.trim();
    if(!val)return;
    document.querySelector(".check-btn").disabled=true;
    inp.disabled=true;
    const ok=matchFill(val,correct2);
    inp.classList.add(ok?"correct":"wrong");
    if(ok){score++;results.push({q:questions[idx].q,user:val,correct:correct2,ok:true});}
    else{
      results.push({q:questions[idx].q,user:val,correct:correct2,ok:false});
      document.getElementById("reveal").innerHTML=`✅ Correct answer: <strong>${correct2}</strong>`;
      document.getElementById("reveal").hidden=false;
    }
    showNav(ok);
  };

  function showNav(ok){
    const fb=document.getElementById("fb");
    fb.hidden=false;
    if(ok){fb.className="feedback ok";fb.textContent="✓ Correct! Great job!";}
    else{fb.className="feedback bad";fb.textContent="✗ Not quite. See the correct answer above.";}
    const nextBtn=document.getElementById("next-btn");
    const finBtn=document.getElementById("finish-btn");
    if(nextBtn)nextBtn.hidden=false;
    if(finBtn)finBtn.hidden=false;
  }

  window.goNext=function(){idx++;if(idx<questions.length)render();else showResult();};
  window.goPrev=function(){if(idx>0){idx--;render();}};

  window.showResult=function(){
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    const rs=document.getElementById("result-screen");
    rs.style.display="block";
    const pct=Math.round((score/questions.length)*100);
    const stars=pct>=90?"⭐⭐⭐⭐⭐":pct>=75?"⭐⭐⭐⭐":pct>=60?"⭐⭐⭐":pct>=40?"⭐⭐":"⭐";
    const r=188; const circ=2*Math.PI*r/3; // scaled
    const wrong=results.filter(r=>!r.ok);
    const right=results.filter(r=>r.ok);
    rs.innerHTML=`
      <div style="max-width:700px;margin:0 auto;padding:20px 0 40px">
        <div class="result-hd">${stars} Quiz Complete!</div>
        <div class="result-sub">${score} / ${questions.length} correct — ${pct}%</div>
        <div class="score-ring-wrap">
          <svg class="ring" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="50"/>
            <circle class="ring-fg" cx="60" cy="60" r="50"
              stroke="${pct>=60?"var(--correct)":"var(--wrong)"}"
              stroke-dasharray="314"
              stroke-dashoffset="${314-314*(pct/100)}"
              transform="rotate(-90 60 60)"/>
            <text class="ring-text" x="60" y="65" text-anchor="middle">${pct}%</text>
          </svg>
        </div>
        <button class="restart-btn" onclick="restartPanel('${panelId}')">🔁 Try Again</button>
        ${wrong.length?`<h3 style="margin:20px 0 10px;font-family:'Fredoka One',cursive">❌ Review Wrong Answers (${wrong.length})</h3>`+wrong.map(r=>`<div class="review-item bad"><div class="review-q">${r.q}</div><div class="review-ans">Your answer: <span class="tag-bad">${r.user||"(blank)"}</span></div><div class="review-ans">Correct: <span class="tag-ok">${r.correct}</span></div></div>`).join(""):""}
        ${right.length?`<h3 style="margin:20px 0 10px;font-family:'Fredoka One',cursive">✅ Correct Answers (${right.length})</h3>`+right.map(r=>`<div class="review-item ok"><div class="review-q">${r.q}</div><div class="review-ans">Your answer: <span class="tag-ok">${r.user}</span> ✓</div></div>`).join(""):""}
      </div>
    `;
  };

  window.restartPanel=function(pid){
    rs.style.display="none";
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    document.getElementById(pid).classList.add("active");
    // Reset tabs
    document.querySelectorAll(".tab-btn").forEach(b=>{
      if(b.dataset.tab===pid)b.classList.add("active");
      else b.classList.remove("active");
    });
    idx=0;score=0;results.length=0;
    render();
  };

  render();
}

    </div>
  `).join("");

function getBestVoice(){
  const vs=speechSynthesis.getVoices();
  const pref=["Samantha","Google US English","Alex","Karen","Victoria"];
  for(const name of pref){const v=vs.find(x=>x.name.includes(name));if(v)return v;}
  return vs.find(v=>v.lang.startsWith("en"))||vs[0]||null;
}
function speakQ(i){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(ORAL[i].q);
  u.voice=getBestVoice();u.lang="en-US";u.rate=0.9;
  speechSynthesis.speak(u);
}
function toggleModel(i){
  const el=document.getElementById("model-"+i);
  el.classList.toggle("show");
}

async function oralToggle(i){
  if(!oralState[i])oralState[i]={recorder:null,chunks:[],blob:null,active:false};
  const s=oralState[i];
  const btn=document.getElementById("rec-btn-"+i);
  const status=document.getElementById("rec-status-"+i);
  if(!s.active){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const types=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"];
      const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||"";
      s.recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
      s.chunks=[];
      s.recorder.ondataavailable=e=>{if(e.data.size>0)s.chunks.push(e.data);};
      s.recorder.onstop=()=>{
        s.blob=new Blob(s.chunks,{type:s.recorder.mimeType});
        stream.getTracks().forEach(t=>t.stop());
        document.getElementById("play-btn-"+i).disabled=false;
        status.textContent="✅ Recording saved!";
      };
      s.recorder.start();
      s.active=true;
      btn.textContent="⏹ Stop";btn.classList.add("recording");
      status.textContent="🔴 Recording…";
    }catch(e){status.textContent="❌ Microphone not available.";}
  } else {
    s.recorder.stop();s.active=false;
    btn.textContent="⏺ Record";btn.classList.remove("recording");
  }
}
function oralPlay(i){
  const s=oralState[i];
  if(!s||!s.blob)return;
  const url=URL.createObjectURL(s.blob);
  const audio=new Audio(url);
  audio.play();
}

    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    document.getElementById("result-screen").style.display="none";
    const tab=btn.dataset.tab;
    document.getElementById(tab).classList.add("active");
    if(tab==="oral")renderOral();
    else if(tab==="mock")startMock();
    else if(tab==="egypt-vocab")initPanel("egypt-vocab",makeVocabQuestions(EV),"egypt");
    else if(tab==="egypt-comp")initPanel("egypt-comp",makeCompQuestions(EC),"egypt");
    else if(tab==="yeller-vocab")initPanel("yeller-vocab",makeVocabQuestions(YV),"yeller");
    else if(tab==="yeller-comp")initPanel("yeller-comp",makeCompQuestions(YC),"yeller");
  });
});

// Initial load
initPanel("egypt-vocab",makeVocabQuestions(EV),"egypt");
</script>
