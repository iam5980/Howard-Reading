<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Howard Reading 115-1 期中考</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f4ff;--surface:#fff;--raised:#f8f9ff;--border:#c5cae9;--fg:#1a237e;--muted:#5c6bc0;--navy:#1565c0;--accent:#1976d2;--chip:#e3f2fd;--chipfg:#0d47a1;--correct:#2e7d32;--wrong:#c62828;--gold:#f57f17;--purple:#6a1b9a;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--surface:#161b2e;--raised:#1e2440;--border:#2e3560;--fg:#e8eaf6;--muted:#9fa8da;--navy:#90caf9;--accent:#64b5f6;--chip:#1e2a4a;--chipfg:#90caf9;--correct:#81c784;--wrong:#ef9a9a;--gold:#ffd54f;--purple:#ce93d8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--surface:#161b2e;--raised:#1e2440;--border:#2e3560;--fg:#e8eaf6;--muted:#9fa8da;--navy:#90caf9;--accent:#64b5f6;--chip:#1e2a4a;--chipfg:#90caf9;--correct:#81c784;--wrong:#ef9a9a;--gold:#ffd54f;--purple:#ce93d8;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Nunito',sans-serif;font-size:16px}
/* HOME */
#home{display:block}
.topbar{background:var(--navy);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.topbar h1{font-family:'Fredoka One',cursive;font-size:1.5rem}
.topbar p{font-size:.8rem;opacity:.85}
.themeBtn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:6px 14px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer}
.unlock{background:#fff8e1;border:2px solid #f9a825;border-radius:12px;padding:14px;margin:16px;text-align:center;display:none}
.unlock p{color:#e65100;font-weight:800;margin-bottom:8px}
.unlock button{background:#f9a825;color:#1a1000;border:none;border-radius:22px;padding:10px 24px;font-size:.95rem;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;min-height:48px}
@media(prefers-color-scheme:dark){.unlock{background:#1a1000;border-color:#f9a825}.unlock p{color:#fbbf24}.unlock button{background:#f9a825}}
:root[data-theme="dark"] .unlock{background:#1a1000;border-color:#f9a825}
:root[data-theme="dark"] .unlock p{color:#fbbf24}
.homeInner{max-width:700px;margin:0 auto;padding:20px 16px}
.zone{margin-bottom:28px}
.zoneLabel{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);color:var(--chipfg);border:2px solid var(--border);border-radius:20px;padding:10px 18px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:6px;transition:.15s}
.chip:hover{border-color:var(--accent);background:var(--accent);color:#fff}
.chip.mock{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.oral{background:var(--purple);color:#fff;border-color:var(--purple)}
/* DRILL PANEL */
#panel{display:none;min-height:100vh}
.panelBar{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.backBtn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:8px 16px;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;min-height:44px}
.panelTitle{font-family:'Fredoka One',cursive;font-size:1.1rem;flex:1}
.finishBtn{background:#ef9a9a;color:#7f0000;border:none;border-radius:20px;padding:8px 16px;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;min-height:44px}
.panelInner{max-width:700px;margin:0 auto;padding:16px}
.newSetBtn{background:var(--navy);color:#fff;border:none;border-radius:22px;padding:10px 24px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:16px;min-height:48px}
/* QUESTION CARD */
.qCard{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.qNum{font-size:.75rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.qText{font-size:1.05rem;font-weight:700;line-height:1.5;margin-bottom:16px}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.choice{background:var(--raised);border:2px solid var(--border);border-radius:10px;padding:12px 16px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;text-align:left;color:var(--fg);transition:.15s;min-height:48px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.selected{border-color:var(--accent);background:var(--chip)}
.choice:disabled{cursor:default}
.textInput{width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;background:var(--raised);color:var(--fg);margin-bottom:12px}
.textInput:focus{outline:none;border-color:var(--accent)}
.checkBtn{background:var(--navy);color:#fff;border:none;border-radius:22px;padding:10px 24px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;margin-right:8px;min-height:46px}
.nextBtn{background:var(--accent);color:#fff;border:none;border-radius:22px;padding:10px 24px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;display:none;min-height:46px}
.speakBtn{background:transparent;border:2px solid var(--muted);color:var(--muted);border-radius:20px;padding:7px 14px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;margin-bottom:12px;min-height:44px}
.feedback{border-radius:10px;padding:12px;margin-top:10px;font-weight:700;font-size:.95rem;display:none}
.feedback.correct{background:#e8f5e9;color:#1b5e20;border:2px solid #81c784;display:block}
.feedback.wrong{background:#ffebee;color:#7f0000;border:2px solid #ef9a9a;display:block}
@media(prefers-color-scheme:dark){.feedback.correct{background:rgba(46,125,50,.2);color:#a5d6a7}.feedback.wrong{background:rgba(183,28,28,.2);color:#ffcdd2}}
:root[data-theme="dark"] .feedback.correct{background:rgba(46,125,50,.2);color:#a5d6a7}
:root[data-theme="dark"] .feedback.wrong{background:rgba(183,28,28,.2);color:#ffcdd2}
.answerBox{background:#fff9c4;color:#4a0;border:2px solid #f9a825;border-radius:8px;padding:12px;margin-top:8px;font-size:1.05rem;font-weight:800}
@media(prefers-color-scheme:dark){.answerBox{background:#1a1400;color:#ffd54f;border-color:#f9a825}}
:root[data-theme="dark"] .answerBox{background:#1a1400;color:#ffd54f;border-color:#f9a825}
/* ORAL CARD */
.oralCard{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.badge{display:inline-block;background:#c62828;color:#fff;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:8px;letter-spacing:.06em}
.btnRow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.btn{padding:9px 16px;border-radius:22px;border:2px solid var(--border);background:var(--raised);color:var(--fg);font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;min-height:46px}
.btn:disabled{opacity:.35;cursor:default}
.btn.teal{border-color:#4dd0e1;color:#4dd0e1}
.btn.red{border-color:#ef9a9a;color:#ef9a9a}
.btn.red.active{background:#c62828;color:#fff;border-color:#c62828}
.btn.green{border-color:var(--correct);color:var(--correct)}
.btn.purple{border-color:var(--purple);color:var(--purple)}
.recInfo{font-size:.8rem;color:var(--muted);font-weight:700;min-height:20px;margin:4px 0 8px}
.modelBox{background:rgba(46,125,50,.1);border:2px solid #81c784;border-radius:10px;padding:14px;margin-top:10px;display:none}
.modelBox.show{display:block}
.modelLabel{font-size:.75rem;color:var(--correct);font-weight:700;margin-bottom:6px}
.modelText{font-size:.95rem;line-height:1.6}
/* SCORE SCREEN */
.scoreScreen{background:var(--surface);border-radius:16px;padding:28px;text-align:center;display:none}
.scoreScreen.show{display:block}
.scoreStar{font-size:2.5rem;margin-bottom:8px}
.scorePct{font-size:2.2rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.scoreDetail{font-size:1rem;color:var(--muted);margin-bottom:20px}
.retryBtn{background:var(--navy);color:#fff;border:none;border-radius:22px;padding:12px 28px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;min-height:48px}
.reviewList{text-align:left;margin-top:24px}
.reviewItem{background:var(--raised);border:2px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.reviewItem.wrong{border-color:#ef9a9a}
.reviewLabel{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.reviewQ{font-size:.9rem;font-weight:700;margin-bottom:6px}
.reviewA{font-size:.85rem}
.correct-a{color:var(--correct);font-weight:700}
.wrong-a{color:var(--wrong);font-weight:700}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="topbar">
    <div>
      <h1>📚 Howard 115-1 期中考</h1>
      <p>Egypt + Old Yeller · Reading Street 6.1</p>
    </div>

  </div>

      <div class="zoneLabel">Practice by Question Type</div>
      <div class="chips">

</div>

<!-- DRILL PANEL -->
<div id="panel">
  <div class="panelBar">
    <button class="backBtn" id="backBtn">← Home</button>
    <span class="panelTitle" id="panelTitle"></span>
    <button class="finishBtn" id="finishBtn">🏁 Finish &amp; Score</button>
  </div>
  <div class="panelInner" id="panelInner"></div>
</div>

<script>
/* ────────────────── THEME ────────────────── */
(function(){
  const saved = localStorage.getItem('theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  this.textContent = next === 'dark' ? '☀️ Light' : '🌙 Dark';
});

/* ────────────────── TTS ────────────────── */
let _voices = [];
function _loadVoices(){
  const v = window.speechSynthesis.getVoices();
  if(v.length) _voices = v;
}
window.speechSynthesis.addEventListener('voiceschanged', _loadVoices);
_loadVoices();
setTimeout(_loadVoices, 500);
setTimeout(_loadVoices, 1500);

function bestVoice(){
  const vv = _voices.length ? _voices : window.speechSynthesis.getVoices();
  const tests = [
    v=>v.name==='Samantha', v=>v.name==='Karen', v=>v.name==='Daniel',
    v=>v.name.includes('Google US English'), v=>v.name.includes('Google UK English'),
    v=>v.lang==='en-US'&&v.localService, v=>v.lang==='en-GB'&&v.localService,
    v=>v.lang.startsWith('en')&&v.localService, v=>v.lang.startsWith('en')
  ];
  for(const t of tests){ const m=vv.find(t); if(m) return m; }
  return null;
}

function speak(text){
  window.speechSynthesis.cancel();
  if(!_voices.length) _voices = window.speechSynthesis.getVoices();
  const u = new SpeechSynthesisUtterance(text);
  const v = bestVoice(); if(v) u.voice = v;
  u.lang='en-US'; u.rate=0.88; u.pitch=1.0;
  window.speechSynthesis.speak(u);
}

/* iOS unlock */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
if(isIOS) document.getElementById('unlockBar').style.display = 'block';

document.getElementById('unlockBtn').addEventListener('click', function(){
  speak('Voice enabled');
  const bar = document.getElementById('unlockBar');
  bar.style.borderColor = '#81c784';
  bar.querySelector('p').textContent = '✅ Voice enabled!';
  this.style.display = 'none';
  setTimeout(()=>{ bar.style.display='none'; }, 1500);
});

/* ────────────────── QUESTION BANK ────────────────── */
const BANK = [
  // VOCAB — Egypt
  {id:"ve01",ty:"vocab",st:"egypt",q:"A hard, shiny black stone that was used in ancient Egypt to make tools and weapons.",a:"obsidian",choices:["obsidian","granite","limestone","basalt"]},
  {id:"ve02",ty:"vocab",st:"egypt",q:"Fine particles of sand, clay, or rock that are carried and deposited by wind or water.",a:"sediment",choices:["sediment","debris","mineral","alluvium"]},
  {id:"ve03",ty:"vocab",st:"egypt",q:"An ancient Egyptian symbol of life shaped like a cross with a loop at the top.",a:"ankh",choices:["ankh","scarab","cartouche","hieroglyph"]},
  {id:"ve04",ty:"vocab",st:"egypt",q:"A large decorated coffin made of stone, often carved and painted, used in ancient Egypt.",a:"sarcophagus",choices:["sarcophagus","catacombs","mausoleum","ossuary"]},
  {id:"ve05",ty:"vocab",st:"egypt",q:"The ancient Egyptian system of writing using pictures and symbols.",a:"hieroglyphics",choices:["hieroglyphics","cuneiform","calligraphy","Braille"]},
  {id:"ve06",ty:"vocab",st:"egypt",q:"A substance used to preserve a dead body and prevent it from decaying.",a:"embalming fluid",choices:["embalming fluid","brine","formaldehyde","resin"]},
  {id:"ve07",ty:"vocab",st:"egypt",q:"The process of preserving a dead body with special chemicals and wrapping it in bandages.",a:"mummification",choices:["mummification","embalming","taxidermy","preservation"]},
  {id:"ve08",ty:"vocab",st:"egypt",q:"A hard, igneous rock often used in ancient Egyptian statues and obelisks.",a:"granite",choices:["granite","marble","sandstone","limestone"]},
  {id:"ve09",ty:"vocab",st:"egypt",q:"An ancient writing material made from a plant that grows along the Nile River.",a:"papyrus",choices:["papyrus","vellum","parchment","papier"]},
  {id:"ve10",ty:"vocab",st:"egypt",q:"A ruler of ancient Egypt believed to be a god.",a:"pharaoh",choices:["pharaoh","emperor","sultan","chieftain"]},
  // VOCAB — Old Yeller
  {id:"vy01",ty:"vocab",st:"yeller",q:"To move forward with a series of leaps and bounds.",a:"lunge",choices:["lunge","stride","amble","shuffle"]},
  {id:"vy02",ty:"vocab",st:"yeller",q:"Making a low, rumbling sound of warning or anger.",a:"growling",choices:["growling","purring","whimpering","howling"]},
  {id:"vy03",ty:"vocab",st:"yeller",q:"The raised bank of earth beside a stream or river.",a:"creek bank",choices:["creek bank","ridge","bluff","embankment"]},
  {id:"vy04",ty:"vocab",st:"yeller",q:"A young bear.",a:"bear cub",choices:["bear cub","foal","calf","kit"]},
  {id:"vy05",ty:"vocab",st:"yeller",q:"Feeling extreme terror or shock.",a:"frantic",choices:["frantic","anxious","nervous","curious"]},
  {id:"vy06",ty:"vocab",st:"yeller",q:"Something that happened in the past; an adventure or experience.",a:"adventure",choices:["adventure","incident","misfortune","episode"]},
  // FILL IN BLANK
  {id:"fi01",ty:"fill",st:"egypt",q:"The ancient Egyptians built the pyramids as ________ for their pharaohs.",a:"tombs",choices:["tombs","palaces","temples","storehouses"]},
  {id:"fi02",ty:"fill",st:"egypt",q:"Ancient Egyptians wrote using a system of pictures called ________.",a:"hieroglyphics",choices:["hieroglyphics","alphabet","cursive","calligraphy"]},
  {id:"fi03",ty:"fill",st:"egypt",q:"The Nile River's annual ________ brought rich soil perfect for farming.",a:"flooding",choices:["flooding","drought","freezing","evaporation"]},
  {id:"fi04",ty:"fill",st:"egypt",q:"Ancient Egyptians placed mummies in a decorated stone coffin called a ________.",a:"sarcophagus",choices:["sarcophagus","coffin","vault","casket"]},
  {id:"fi05",ty:"fill",st:"yeller",q:"Old Yeller fought the ________ to protect Arliss from harm.",a:"mama bear",choices:["mama bear","wolf","wildcat","boar"]},
  {id:"fi06",ty:"fill",st:"yeller",q:"Arliss grabbed a baby ________ at the spring hole.",a:"bear cub",choices:["bear cub","raccoon","rabbit","fox"]},
  {id:"fi07",ty:"fill",st:"yeller",q:"After the fight, Mama held Old Yeller inside the ________ and cried.",a:"cabin",choices:["cabin","barn","pen","yard"]},
  {id:"fi08",ty:"fill",st:"egypt",q:"The ancient Egyptians used ________ to preserve their dead before mummification.",a:"salts and oils",choices:["salts and oils","honey","wax","herbs"]},
  {id:"fi09",ty:"fill",st:"yeller",q:"Old Yeller was ________ up the creek bank when he fought the bear.",a:"lunging",choices:["lunging","running","crawling","creeping"]},
  {id:"fi10",ty:"fill",st:"egypt",q:"Ancient Egyptians built monuments called ________ with a pointed top.",a:"obelisks",choices:["obelisks","pillars","arches","columns"]},
  // TRUE / FALSE
  {id:"tf01",ty:"tf",st:"egypt",q:"The ancient Egyptians built pyramids as tombs for their pharaohs.",a:"TRUE",choices:["TRUE","FALSE"]},
  {id:"tf02",ty:"tf",st:"egypt",q:"Hieroglyphics is a system of writing that uses letters of the alphabet.",a:"FALSE",choices:["TRUE","FALSE"]},
  {id:"tf03",ty:"tf",st:"egypt",q:"The Nile River flooding was harmful to ancient Egyptian farmers.",a:"FALSE",choices:["TRUE","FALSE"]},
  {id:"tf04",ty:"tf",st:"egypt",q:"Ancient Egyptians believed the soul needed the body in the afterlife, so they preserved bodies.",a:"TRUE",choices:["TRUE","FALSE"]},
  {id:"tf05",ty:"tf",st:"egypt",q:"Papyrus was an ancient writing material made from a Nile River plant.",a:"TRUE",choices:["TRUE","FALSE"]},
  {id:"tf06",ty:"tf",st:"yeller",q:"In 'Old Yeller', Arliss was grabbed by a mama bear.",a:"FALSE",choices:["TRUE","FALSE"]},
  {id:"tf07",ty:"tf",st:"yeller",q:"Old Yeller protected Arliss from a bear to save his life.",a:"TRUE",choices:["TRUE","FALSE"]},

  {id:"tf09",ty:"tf",st:"yeller",q:"Arliss was trying to catch a bear cub when the mama bear attacked.",a:"TRUE",choices:["TRUE","FALSE"]},
  {id:"tf10",ty:"tf",st:"egypt",q:"Egypt is located in the northern part of Africa.",a:"TRUE",choices:["TRUE","FALSE"]},
  // MULTIPLE CHOICE
  {id:"mc01",ty:"mc",st:"egypt",q:"What is the genre of 'Egypt' by Ann Heinrichs?",a:"Expository text",choices:["Expository text","Historical fiction","Biography","Realistic fiction"]},
  {id:"mc02",ty:"mc",st:"yeller",q:"What is the genre of 'Old Yeller' by Fred Gipson?",a:"Historical fiction",choices:["Historical fiction","Expository text","Fantasy","Mystery"]},
  {id:"mc03",ty:"mc",st:"egypt",q:"What did the Nile River flooding bring to the land?",a:"Rich soil for farming",choices:["Rich soil for farming","Fresh drinking water","Fish to eat","Cooling temperatures"]},
  {id:"mc04",ty:"mc",st:"egypt",q:"Why did ancient Egyptians mummify their dead?",a:"They believed the soul needed the body in the afterlife",choices:["They believed the soul needed the body in the afterlife","They wanted to display the body","It was cheaper than burial","To prevent disease"]},
  {id:"mc05",ty:"mc",st:"yeller",q:"Why did Old Yeller fight the mama bear?",a:"To protect Arliss",choices:["To protect Arliss","To get food","He was trained to fight bears","The bear attacked him first"]},
  {id:"mc06",ty:"mc",st:"egypt",q:"What is 'expository text'?",a:"Writing that gives facts and information about a real topic",choices:["Writing that gives facts and information about a real topic","A story set in the past","A story from the author's own life","A story with magical elements"]},
  {id:"mc07",ty:"mc",st:"yeller",q:"What is 'historical fiction'?",a:"A story set in the past that mixes real events with made-up characters",choices:["A story set in the past that mixes real events with made-up characters","A true story about a famous person","Writing that gives facts about history","A fantasy story set long ago"]},
  {id:"mc08",ty:"mc",st:"egypt",q:"What were obelisks?",a:"Tall stone monuments with a pointed top",choices:["Tall stone monuments with a pointed top","Underground tombs","Painted walls","Decorated coffins"]},
  {id:"mc09",ty:"mc",st:"yeller",q:"What is the Question of the Week for 'Old Yeller'?",a:"How can we help protect those we love?",choices:["How can we help protect those we love?","What does it mean to be brave?","How do animals help people?","What makes a good friendship?"]},

/* ────────────────── SHUFFLE ────────────────── */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ────────────────── DRILL STATE ────────────────── */
let drillQ = [];    // question list for current drill
let drillIdx = 0;
let drillResults = [];
let currentDrill = '';
const oralState = ORAL.map(()=>({recorder:null,chunks:[],blob:null,timer:null}));

/* ────────────────── HOME NAVIGATION ────────────────── */
document.querySelectorAll('[data-drill]').forEach(btn=>{
  btn.addEventListener('click', ()=> startDrill(btn.dataset.drill));
});
document.getElementById('backBtn').addEventListener('click', goHome);
document.getElementById('finishBtn').addEventListener('click', finishEarly);

function goHome(){
  document.getElementById('home').style.display='';
  document.getElementById('panel').style.display='none';
  window.speechSynthesis.cancel();
}

function startDrill(type){
  currentDrill = type;
  drillIdx = 0;
  drillResults = [];
  document.getElementById('home').style.display='none';
  document.getElementById('panel').style.display='';

  const TITLES = {
    vocab:'📖 Vocabulary', fill:'✏️ Fill in Blank', tf:'✅ True / False',
    mc:'🔤 Multiple Choice', short:'💬 Short Answer', genre:'📚 Genre',
    egypt:'🏺 Egypt', yeller:'🐶 Old Yeller',
    oral:'🗣️ Oral Must-Know', mock:'🎯 Full Mock Exam'
  };
  document.getElementById('panelTitle').textContent = TITLES[type] || type;

  if(type==='oral'){
    document.getElementById('finishBtn').style.display='none';
    renderOral();
    return;
  }
  document.getElementById('finishBtn').style.display='';

  let pool;
  if(type==='mock') pool = shuffle(BANK).slice(0,30);
  else if(type==='egypt') pool = shuffle(BANK.filter(q=>q.st==='egypt'));
  else if(type==='yeller') pool = shuffle(BANK.filter(q=>q.st==='yeller'));
  else if(type==='genre') pool = shuffle(BANK.filter(q=>q.ty==='genre'));
  else if(type==='short') pool = shuffle(BANK.filter(q=>q.ty==='fill'||q.id.startsWith('sa')));
  else pool = shuffle(BANK.filter(q=>q.ty===type));

  drillQ = pool;
  renderQ();
}

/* ────────────────── RENDER QUESTION ────────────────── */
function renderQ(){
  const cont = document.getElementById('panelInner');
  if(drillIdx >= drillQ.length){ showScore(); return; }
  const q = drillQ[drillIdx];
  const isMock = currentDrill==='mock';
  const choices = shuffle(q.choices);
  let html = '';
  if(isMock){
    html += `<button class="newSetBtn" id="newSetBtn">🔀 New Random Set</button>`;
  }
  html += `<div class="qCard">
    <div class="qNum">Question ${drillIdx+1} / ${drillQ.length}</div>
    <div class="qText" id="qText">${q.q}</div>
    <button class="speakBtn" id="speakQBtn">🔊 Hear Question</button>
    <div class="choices" id="choices">
      ${choices.map((c,ci)=>`<button class="choice" data-c="${ci}" data-val="${c}">${c}</button>`).join('')}
    </div>
    <div>
      <button class="checkBtn" id="checkBtn">Check Answer</button>
      <button class="nextBtn" id="nextBtn">${drillIdx+1<drillQ.length?'Next →':'Finish!'}</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>`;
  cont.innerHTML = html;

  if(isMock){
    document.getElementById('newSetBtn').addEventListener('click', ()=>startDrill('mock'));
  }
  document.getElementById('speakQBtn').addEventListener('click', ()=>speak(q.q));

  document.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click', function(){
      if(this.disabled) return;
      document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));
      this.classList.add('selected');
    });
  });

  document.getElementById('checkBtn').addEventListener('click', ()=>checkAnswer(q));
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    drillIdx++; renderQ();
  });
}

function checkAnswer(q){
  const sel = document.querySelector('.choice.selected');
  if(!sel){ alert('Please select an answer first.'); return; }
  const given = sel.dataset.val;
  const correct = q.a;
  const isRight = given.toLowerCase() === correct.toLowerCase();
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').style.display='';
  drillResults.push({q:q.q, given, correct, ok:isRight});
  const fb = document.getElementById('feedback');
  if(isRight){
    fb.className='feedback correct';
    fb.textContent='✅ Correct! Great job!';
  } else {
    fb.className='feedback wrong';
    fb.innerHTML='❌ Not quite.<div class="answerBox">✅ Correct answer: ' + correct + '</div>';
  }
  sel.style.background = isRight ? 'rgba(46,125,50,.15)' : 'rgba(183,28,28,.15)';
  sel.style.borderColor = isRight ? '#81c784' : '#ef9a9a';
}

function finishEarly(){
  showScore();
}

/* ────────────────── SCORE SCREEN ────────────────── */
function showScore(){
  const cont = document.getElementById('panelInner');
  const answered = drillResults.length;
  const correct = drillResults.filter(r=>r.ok).length;
  const pct = answered > 0 ? Math.round(correct/answered*100) : 0;
  const stars = pct>=90?'⭐⭐⭐⭐⭐':pct>=75?'⭐⭐⭐⭐':pct>=55?'⭐⭐⭐':pct>=40?'⭐⭐':'⭐';
  const label = pct>=90?'Outstanding! 🏆':pct>=75?'Good job! 😊':pct>=55?'Getting there! 💪':'Keep practising! 📖';
  const wrong = drillResults.filter(r=>!r.ok);
  const right = drillResults.filter(r=>r.ok);
  let review = '';
  if(wrong.length){
    review += '<div style="font-weight:800;margin-bottom:8px;color:var(--wrong)">❌ Review — wrong answers:</div>';
    wrong.forEach(r=>{
      review += `<div class="reviewItem wrong">
        <div class="reviewQ">${r.q}</div>
        <div class="reviewA"><span class="wrong-a">Your answer: ${r.given}</span></div>
        <div class="reviewA"><span class="correct-a">✅ Correct: ${r.correct}</span></div>
      </div>`;
    });
  }
  if(right.length){
    review += '<div style="font-weight:800;margin:12px 0 8px;color:var(--correct)">✅ Correct answers:</div>';
    right.forEach(r=>{
      review += `<div class="reviewItem">
        <div class="reviewQ">${r.q}</div>
        <div class="reviewA"><span class="correct-a">✅ ${r.correct}</span></div>
      </div>`;
    });
  }
  cont.innerHTML = `
    <div class="scoreScreen show">
      <div class="scoreStar">${stars}</div>
      <div class="scorePct">${pct}%</div>
      <div class="scoreDetail">${correct} / ${answered} correct · ${label}</div>
      <button class="retryBtn" id="retryBtn">🔄 Try Again</button>
    </div>
    <div class="reviewList">${review}</div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=>startDrill(currentDrill));
}

/* ────────────────── ORAL ────────────────── */
function renderOral(){
  const cont = document.getElementById('panelInner');
  cont.innerHTML = `
  <div style="background:#1a0a2a;border:2px solid #a855f7;color:#e9d5ff;border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:.9rem;line-height:1.7">
    <strong style="color:#c084fc">Recording requires Safari or Chrome</strong><br>
    Open this file in Safari (iOS) or Chrome — not inside another app.<br>
    iOS: tap ··· → <em>Open in Safari</em>
  </div>
  ${ORAL.map((item,i)=>`
  <div class="oralCard">
    ${item.exam?'<div class="badge">★ EXAM MUST-KNOW</div>':''}
    <div class="qNum">Oral Question ${i+1}</div>
    <div class="qText" id="oq-${i}">${item.q}</div>
    <div class="btnRow">

      <button class="btn green" id="oplay-${i}" disabled>▶ Play Back</button>
    </div>
    <div class="recInfo" id="ori-${i}"></div>
    <div id="orw-${i}" style="display:none">
      <button class="btn purple" data-orev="${i}">👁 Reveal Answer</button>
    </div>
    <div class="modelBox" id="omb-${i}">
      <div class="modelLabel">✅ Model Answer</div>
      <div class="modelText">${item.model}</div>
      <div style="margin-top:10px">
        <button class="btn teal" data-om="${i}">🔊 Hear Model Answer</button>
      </div>
    </div>
  </div>`).join('')}`;

  // Attach listeners after DOM
  document.querySelectorAll('[data-oq]').forEach(btn=>{
    const i = +btn.dataset.oq;
    btn.addEventListener('click', ()=>speak(ORAL[i].q));
  });
  document.querySelectorAll('[data-om]').forEach(btn=>{
    const i = +btn.dataset.om;
    btn.addEventListener('click', ()=>speak(ORAL[i].model));
  });
  document.querySelectorAll('[data-orev]').forEach(btn=>{
    const i = +btn.dataset.orev;
    btn.addEventListener('click', ()=>{
      document.getElementById('omb-'+i).classList.add('show');
      document.getElementById('orw-'+i).style.display='none';
    });
  });
  ORAL.forEach((_,i)=>{
    document.getElementById('orec-'+i).addEventListener('click', ()=>oralToggle(i));
    document.getElementById('oplay-'+i).addEventListener('click', ()=>oralPlay(i));
  });
}

async function oralToggle(i){
  const s = oralState[i];
  const btn = document.getElementById('orec-'+i);
  const info = document.getElementById('ori-'+i);
  if(!s.recorder || s.recorder.state==='inactive'){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mimes = ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
      const mime = mimes.find(m=>MediaRecorder.isTypeSupported(m)) || '';
      s.recorder = new MediaRecorder(stream, mime?{mimeType:mime}:{});
      s.chunks = [];
      s.recorder.ondataavailable = e=>{ if(e.data.size>0) s.chunks.push(e.data); };
      s.recorder.onstop = ()=>{
        s.blob = new Blob(s.chunks,{type:s.recorder.mimeType||'audio/webm'});
        document.getElementById('oplay-'+i).disabled=false;
        document.getElementById('orw-'+i).style.display='block';
        btn.textContent='⏺ Record Again'; btn.classList.remove('active');
        info.textContent='Recording saved!';
        clearInterval(s.timer);
      };
      s.recorder.start(200);
      btn.textContent='⏹ Stop'; btn.classList.add('active');
      let sec=0;
      s.timer=setInterval(()=>{
        sec++; info.textContent='Recording… '+sec+'s / 90s';
        if(sec>=90) oralToggle(i);
      },1000);
    }catch(e){
      alert('Microphone access denied. Allow microphone in browser settings.');
    }
  } else if(s.recorder.state==='recording'){
    clearInterval(s.timer);
    s.recorder.stop();
    s.recorder.stream.getTracks().forEach(t=>t.stop());
  }
}

function oralPlay(i){
  const s = oralState[i];
  if(!s.blob) return;
  const url = URL.createObjectURL(s.blob);
  const audio = new Audio(url);
  audio.play();
}
