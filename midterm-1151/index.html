/* ── TOKENS ── */
:root {
  --bg:#f0f4fb; --surface:#fff; --raised:#e4eaf5; --border:#ccd5ea;

}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161b2e; --raised:#1e2440; --border:#2e3560;

}}

}

*{box-sizing:border-box;margin:0;padding:0}
body{

}

/* ── SCREENS ── */
#home-screen{display:block}
#drill-screen{display:none}

/* ── HOME ── */
.home-header{
  background:var(--navy);color:#fff;
  padding:28px 24px 24px;
  border-radius:0 0 24px 24px;
  margin-left:max(-16px,calc(0px - env(safe-area-inset-left,0px)));
  margin-right:max(-16px,calc(0px - env(safe-area-inset-right,0px)));

}

.home-header .sub{font-size:.9rem;opacity:.8}

.zone{margin-bottom:24px}
.zone-label{
  font-family:'Fredoka One',cursive;font-size:1rem;
  color:var(--navy);letter-spacing:.05em;text-transform:uppercase;
  margin-bottom:10px;padding-bottom:6px;
  border-bottom:2px solid var(--border);
}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  padding:10px 18px;border-radius:30px;border:none;
  background:var(--sky);color:#fff;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;
  cursor:pointer;transition:.15s;min-height:48px;
  display:flex;align-items:center;gap:6px;
}
.chip:hover{background:var(--sky2)}
.chip.egypt{background:var(--egypt)}
.chip.egypt:hover{filter:brightness(.9)}
.chip.yeller{background:var(--yeller)}
.chip.yeller:hover{filter:brightness(.9)}
.chip.oral-c{background:var(--oral)}
.chip.oral-c:hover{filter:brightness(.9)}
.chip.mock-c{background:var(--mock)}
.chip.mock-c:hover{filter:brightness(.9)}

/* ── DRILL ── */
#drill-header{

}

#back-btn{

  font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap;
}

  font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap;
}

.prog-wrap{margin-bottom:16px}

.prog-bar{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:var(--sky);transition:.4s}

/* ── QUESTION CARD ── */

}
.choice-btn:hover:not(:disabled){background:var(--sky);color:#fff;border-color:var(--sky)}
.choice-btn.correct{background:var(--correct)!important;color:#fff!important;border-color:var(--correct)!important}
.choice-btn.wrong{background:var(--wrong)!important;color:#fff!important;border-color:var(--wrong)!important}

/* ═══════════ VOICE ═══════════ */
/* ── TTS setup ── */
let _voices=[];
let _ttsUnlocked=false;

function _loadVoices(){_voices=speechSynthesis.getVoices();}
speechSynthesis.addEventListener("voiceschanged",_loadVoices);
_loadVoices();

// iOS Safari: unlock speechSynthesis on first user gesture
function _unlockTTS(){
  if(_ttsUnlocked)return;
  _ttsUnlocked=true;
  const u=new SpeechSynthesisUtterance("");
  window.speechSynthesis.speak(u);
  _voices=speechSynthesis.getVoices();
}
document.addEventListener("touchstart",_unlockTTS,{once:true,passive:true});
document.addEventListener("click",_unlockTTS,{once:true});

function getBestVoice(){
  const voices=_voices.length?_voices:speechSynthesis.getVoices();
  const priority=[
    v=>v.name==="Samantha",v=>v.name==="Karen",v=>v.name==="Daniel",
    v=>v.name.includes("Google US English"),v=>v.name.includes("Google UK English"),
    v=>v.lang==="en-US"&&v.localService,v=>v.lang==="en-GB"&&v.localService,
    v=>v.lang.startsWith("en")&&v.localService,v=>v.lang.startsWith("en")
  ];
  for(const test of priority){const m=voices.find(test);if(m)return m;}
  return null;
}

function speak(text){
  window.speechSynthesis.cancel();
  if(!_voices.length)_voices=speechSynthesis.getVoices();
  const u=new SpeechSynthesisUtterance(text);
  const v=getBestVoice();
  if(v)u.voice=v;
  u.lang="en-US";u.rate=0.88;u.pitch=1.0;
  window.speechSynthesis.speak(u);
}

/* ═══════════ HELPERS ═══════════ */
function shuf(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function norm(s){return s.trim().toLowerCase().replace(/[^a-z0-9]/g,"");}
function matchFill(input,answer){
  const ni=norm(input),na=norm(answer);
  if(ni===na)return true;
  if(na.length>=4){
    if(Math.abs(ni.length-na.length)>1)return false;
    let d=0;
    const long=ni.length>na.length?ni:na,short=ni.length>na.length?na:ni;
    for(let i=0,j=0;i<long.length;i++){if(long[i]!==short[j]){d++;j--;}j++;if(d>1)return false;}
    return true;
  }
  return false;
}
function starsFor(pct){
  if(pct>=90)return "⭐⭐⭐⭐⭐";
  if(pct>=75)return "⭐⭐⭐⭐";
  if(pct>=55)return "⭐⭐⭐";
  if(pct>=40)return "⭐⭐";
  return "⭐";
}

/* ═══════════ QUESTION BUILDERS ═══════════ */
function makeVocabQs(pool){
  const qs=[];
  pool.forEach(item=>{
    qs.push({type:"fill",q:"Definition: \""+item.def+"\"\n\nWhat is this vocabulary word?",a:item.w});
  });
  pool.forEach(item=>{
    const wrong=shuf(pool.filter(x=>x.w!==item.w)).slice(0,3).map(x=>x.def);
    const opts=shuf([item.def,...wrong]);
    qs.push({type:"mc",q:"What is the definition of \""+item.w+"\" ("+item.pos+")?",opts,a:item.def});
  });
  return shuf(qs);
}
function makeCompQs(pool){
  return shuf(pool).map(q=>{
    const opts=shuf(q.o);
    return {type:"mc",q:q.q,opts,a:q.o[q.a]};
  });
}
function makeFillOnly(ev,yv){
  const qs=[];
  [...ev,...yv].forEach(item=>{
    qs.push({type:"fill",q:"Definition: \""+item.def+"\"\n\nWhat is this vocabulary word?",a:item.w});
  });
  return shuf(qs);
}
function makeMCOnly(ev,yv,ec,yc){
  const qs=[];
  [...ev,...yv].forEach(item=>{
    const pool=item.w.length>6?ev:yv;
    const wrong=shuf(pool.filter(x=>x.w!==item.w)).slice(0,3).map(x=>x.def);
    const opts=shuf([item.def,...wrong]);
    qs.push({type:"mc",q:"What is the definition of \""+item.w+"\"?",opts,a:item.def});
  });
  [...ec,...yc].forEach(q=>{
    const opts=shuf(q.o);
    qs.push({type:"mc",q:q.q,opts,a:q.o[q.a]});
  });
  return shuf(qs);
}

let drillQs=[],drillIdx=0,drillScore=0,drillResults=[],drillTitle="",drillSource="";
let mockTimer=null;

function getQsForSource(src){
  switch(src){
    case "egypt-vocab": return makeVocabQs(EV);
    case "egypt-comp": return makeCompQs(EC);
    case "yeller-vocab": return makeVocabQs(YV);
    case "yeller-comp": return makeCompQs(YC);
    case "fill-only": return makeFillOnly(EV,YV);
    case "mc-only": return makeMCOnly(EV,YV,EC,YC);
    case "egypt-all": return shuf([...makeVocabQs(EV),...makeCompQs(EC)]);
    case "yeller-all": return shuf([...makeVocabQs(YV),...makeCompQs(YC)]);
    case "mock": return shuf([
      ...shuf(makeVocabQs(EV)).slice(0,7),
      ...shuf(makeVocabQs(YV)).slice(0,7),
      ...shuf(makeCompQs(EC)).slice(0,8),
      ...shuf(makeCompQs(YC)).slice(0,8)
    ]);
    default: return [];
  }
}

/* ═══════════ RENDER QUESTION ═══════════ */
function renderQ(){
  const body=document.getElementById("drill-body");
  if(drillIdx>=drillQs.length){showResult();return;}
  const q=drillQs[drillIdx];
  const pct=Math.round((drillIdx/drillQs.length)*100);
  let html=`<div class="prog-wrap">
    <div class="prog-label">Question ${drillIdx+1} / ${drillQs.length}</div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="qcard">
    <div class="qnum">Q${drillIdx+1}</div>
    <div class="qtext">${q.q.replace(/\n/g,"<br>")}</div>`;
  if(q.type==="mc"){
    html+=`<div class="choices">`+q.opts.map((o,i)=>`<button class="choice-btn" id="mc${i}" onclick="checkMC(${i})">${o}</button>`).join("")+`</div>`;
  } else {
    html+=`<input class="fill-input" id="fill-in" placeholder="Type the vocabulary word…" autocorrect="off" autocapitalize="none">
    <br><button class="check-btn" id="check-btn" onclick="checkFill()">Check Answer</button>`;
  }
  html+=`<div id="fb" class="feedback" hidden></div>
  <div id="reveal" class="ans-reveal" hidden></div>
  <div class="nav-row">
    <button class="nav-btn" id="prev-btn" ${drillIdx===0?"disabled":""} onclick="goQ(drillIdx-1)">← Prev</button>
    <button class="nav-btn primary" id="next-btn" hidden onclick="goQ(drillIdx+1)">Next →</button>
    ${drillIdx===drillQs.length-1?'<button class="nav-btn primary" id="done-btn" hidden onclick="showResult()">Finish ✓</button>':""}
  </div>
  </div>`;
  body.innerHTML=html;
  if(q.type==="fill"){
    const fi=document.getElementById("fill-in");
    fi.addEventListener("keydown",e=>{if(e.key==="Enter")checkFill();});
    fi.focus();
  }
}

/* MC option text stored in button textContent */
function checkMC(i){
  const q=drillQs[drillIdx];
  const chosen=q.opts[i];
  document.querySelectorAll(".choice-btn").forEach(b=>b.disabled=true);
  const ok=chosen===q.a;
  document.getElementById("mc"+i).classList.add(ok?"correct":"wrong");
  if(!ok){
    const ci=q.opts.indexOf(q.a);
    document.getElementById("mc"+ci).classList.add("correct");
  }
  const fb=document.getElementById("fb");
  fb.hidden=false;
  if(ok){fb.className="feedback ok";fb.textContent="✓ Correct! Great job!";drillScore++;}
  else{fb.className="feedback bad";fb.textContent="✗ Not quite.";}
  drillResults.push({q:q.q,user:chosen,correct:q.a,ok});
  showNextBtn();
}

function checkFill(){
  const q=drillQs[drillIdx];
  const fi=document.getElementById("fill-in");
  const val=fi.value.trim();
  if(!val)return;
  const cb=document.getElementById("check-btn");
  cb.disabled=true;fi.disabled=true;
  const ok=matchFill(val,q.a);
  fi.classList.add(ok?"correct":"wrong");
  const fb=document.getElementById("fb");
  fb.hidden=false;
  if(ok){fb.className="feedback ok";fb.textContent="✓ Correct! Great job!";drillScore++;}
  else{
    fb.className="feedback bad";fb.textContent="✗ Not quite.";
    const rev=document.getElementById("reveal");
    if(rev){rev.hidden=false;rev.innerHTML="<strong>✅ Correct answer:</strong> "+q.a;}
  }
  drillResults.push({q:q.q,user:val,correct:q.a,ok});
  showNextBtn();
}

function showNextBtn(){
  const nb=document.getElementById("next-btn");
  if(nb)nb.hidden=false;
  const db=document.getElementById("done-btn");
  if(db)db.hidden=false;
}

function goQ(n){
  drillIdx=n;
  renderQ();
}

function finishEarly(){
  if(drillResults.length===0){alert("Answer at least one question first!");return;}
  showResult();
}

/* ═══════════ RESULT SCREEN ═══════════ */
function showResult(){
  if(mockTimer){clearInterval(mockTimer);mockTimer=null;}
  const total=drillResults.length;
  const right=drillScore;
  const pct=total>0?Math.round((right/total)*100):0;
  const circ=2*Math.PI*50;
  const offs=circ-(circ*pct/100);
  const stars=starsFor(pct);
  const wrongs=drillResults.filter(r=>!r.ok);
  const rights=drillResults.filter(r=>r.ok);
  let html=`<div style="padding:16px 0 60px;max-width:700px;margin:0 auto">
    <div class="result-hd">🎉 Score: ${right} / ${total}</div>
    <div class="result-sub">${drillTitle}</div>
    <div class="stars">${stars} ${pct}%</div>
    <div class="score-ring-wrap">
      <svg class="ring" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="50"/>
        <circle class="ring-fg" cx="60" cy="60" r="50"
          stroke="${pct>=75?"var(--correct)":"var(--wrong)"}"
          stroke-dasharray="${circ}" stroke-dashoffset="${offs}"
          transform="rotate(-90 60 60)"/>
        <text class="ring-text" x="60" y="67" text-anchor="middle">${pct}%</text>
      </svg>
    </div>`;
  if(wrongs.length){
    html+=`<div style="font-weight:700;margin-bottom:8px;color:var(--wrong)">❌ Review (${wrongs.length} wrong):</div>`;
    wrongs.forEach(r=>{
      html+=`<div class="review-item bad">
        <div class="review-q">${r.q}</div>
        <div class="review-ans">Your answer: <span class="tag-bad">${r.user||"(blank)"}</span></div>
        <div class="review-ans">Correct: <span class="tag-ok">${r.correct}</span></div>
      </div>`;
    });
  }
  if(rights.length&&wrongs.length){
    html+=`<div style="font-weight:700;margin-top:12px;margin-bottom:8px;color:var(--correct)">✅ Correct (${rights.length}):</div>`;
    rights.forEach(r=>{
      html+=`<div class="review-item ok">
        <div class="review-q">${r.q}</div>
        <div class="review-ans">Answer: <span class="tag-ok">${r.correct}</span></div>
      </div>`;
    });
  }
  html+=`<button class="restart-btn" onclick="restartDrill()">🔄 Try Again</button>
  <button class="home-btn2" onclick="goHome()">🏠 Home</button>
  </div>`;
  document.getElementById("drill-body").innerHTML=html;
  document.getElementById("finish-score-btn").style.display="none";
}

function restartDrill(){
  drillQs=getQsForSource(drillSource);
  drillIdx=0;drillScore=0;drillResults=[];
  document.getElementById("finish-score-btn").style.display="";
  renderQ();
}

async function oralToggle(i){
  const state=oralState[i];
  const btn=document.getElementById("rec-"+i);
  const timer=document.getElementById("rec-timer-"+i);
  if(!state.recorder||state.recorder.state==="inactive"){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mimes=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"];
      const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||"";
      state.recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
      state.chunks=[];
      state.recorder.ondataavailable=e=>{if(e.data.size>0)state.chunks.push(e.data);};
      state.recorder.onstop=()=>{
        state.blob=new Blob(state.chunks,{type:state.recorder.mimeType||"audio/webm"});
        document.getElementById("play-"+i).disabled=false;
        document.getElementById("reveal-wrap-"+i).style.display="block";
        btn.textContent="⏺ Record Again";
        btn.classList.remove("recording");
        timer.textContent="";
      };
      state.recorder.start(200);
      btn.textContent="⏹ Stop";
      btn.classList.add("recording");
      let sec=0;
      state._timerInt=setInterval(()=>{
        sec++;
        timer.textContent=`Recording… ${sec}s`;
        if(sec>=90){oralToggle(i);}
      },1000);
    } catch(e){
      alert("Microphone access denied. Please allow microphone in browser settings.");
    }
  } else if(state.recorder.state==="recording"){
    clearInterval(state._timerInt);
    state.recorder.stop();
    state.recorder.stream.getTracks().forEach(t=>t.stop());
  }
}

function oralPlay(i){
  const state=oralState[i];
  if(!state.blob)return;
  const url=URL.createObjectURL(state.blob);
  const audio=new Audio(url);
  audio.play();
}

function oralReveal(i){
  const m=document.getElementById("oral-model-"+i);
  m.classList.add("show");
  document.getElementById("reveal-wrap-"+i).style.display="none";
}
</script>
</html>
